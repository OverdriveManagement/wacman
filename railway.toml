# Service API WacMan sur Railway (monorepo : construit depuis la racine du dépôt)
[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run build -w @wacman/api"
watchPatterns = ["apps/api/**", "packages/core/**", "package-lock.json"]

[deploy]
startCommand = "npm run start -w @wacman/api"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
